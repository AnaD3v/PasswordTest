directories:
  output: dist
  buildResources: build
appId: com.seuapp.passwordtesting
productName: PasswordTesting
asar: true
files:
  - filter:
      - src/**/*
      - node_modules/**/*
      - package.json
asarUnpack: '**/*.{exe,dll,bin,so,dmg}'
publish: null
nsis:
  oneClick: true
  perMachine: false
  shortcutName: PasswordTesting
  createDesktopShortcut: true
win:
  target:
    - nsis
  icon: ./public/icons/app-icon.ico
  signtoolOptions:
    signingHashAlgorithms: []
mac:
  target:
    - dmg
  icon: ./public/icons/app-icon.icns
  type: distribution
  category: public.app-category.utilities
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  extraResources: []
linux:
  target:
    - AppImage
    - tar.gz
  icon: ./public/icons/app-icon.png
electronVersion: 35.0.0
